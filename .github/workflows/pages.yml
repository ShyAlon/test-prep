name: Deploy to GitHub Pages
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Upload Pages artifact
        id: upload
        timeout-minutes: 5
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 11
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Upload returned no valid artifact ID');
            const repo = context.repo;
            const { data: artifact } = await github.rest.actions.getArtifact({ ...repo, artifact_id: artifactId });
            if (artifact.name !== 'github-pages' || artifact.expired || artifact.workflow_run?.id !== context.runId) {
              throw new Error('Uploaded artifact is expired or does not belong to this run');
            }
            const oidcToken = await core.getIDToken();
            core.setSecret(oidcToken);
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo, artifact_id: artifactId, pages_build_version: context.sha, oidc_token: oidcToken,
            });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('GitHub returned no deployment ID');
            const failed = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...repo, deployment_id: deploymentId,
              });
              core.info(`Pages: ${data.status}`);
              if (data.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (failed.includes(data.status)) throw new Error(`Pages: ${data.status}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
              ...repo, deployment_id: deploymentId,
            });
            throw new Error('Pages deployment timed out');
